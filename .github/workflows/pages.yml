name: Deploy to GitHub Pages

# Publikacja przez gałąź gh-pages: GITHUB_TOKEN nie może włączyć Pages
# w trybie "GitHub Actions" (wymaga uprawnień administratora repo),
# więc strona jest serwowana z gałęzi gh-pages, a ten workflow ją synchronizuje.

on:
  push:
    branches: [claude/plugin-install-setup-q3zp0r]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publikujemy tylko pliki strony — briefy projektowe zostają w repo
      - name: Collect static site
        run: |
          mkdir -p _site
          cp index.html meble-na-wymiar.html realizacje.html jak-pracujemy.html kontakt.html _site/
          cp -r css js assets _site/
          touch _site/.nojekyll

      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
