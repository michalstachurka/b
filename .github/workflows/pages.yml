name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/plugin-install-setup-q3zp0r]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publikujemy tylko pliki strony — briefy projektowe zostają w repo
      - name: Collect static site
        run: |
          mkdir -p _site
          cp index.html meble-na-wymiar.html realizacje.html jak-pracujemy.html kontakt.html _site/
          cp -r css js assets _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
